    <!-- Inter for prose, JetBrains Mono for numerical readouts. The mono face is
         load-bearing, not decorative: tailwind.config.js points fontFamily.mono at
         it and ~280 spans in the tree rely on it for column-aligned figures. That
         config also lists system-mono fallbacks, so an offline rig still gets a
         fixed pitch. Space Grotesk stays dropped — font-display aliases to sans. -->

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
